services:
  postgres:
    image: postgres:16
    container_name: ksef-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
      POSTGRES_DB: ksef
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d ksef"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
